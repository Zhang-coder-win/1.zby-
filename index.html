<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论文雷达 · Research Radar</title><style>:root{--b:#5b5bd6;--bg:#f5f7fb;--tx:#172033;--mu:#6b7280;--ln:#e7eaf1}*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f7f8ff,#f4fbff);color:var(--tx)}.wrap{max-width:1280px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:22px}.brand span{color:var(--b)}.pill{font-size:12px;background:#eaf8f2;color:#0a7a55;padding:8px 12px;border-radius:999px}.hero{background:linear-gradient(135deg,#23274f,#5b5bd6);color:#fff;border-radius:24px;padding:28px;box-shadow:0 20px 60px #34356a22}.hero h1{margin:6px 0 8px;font-size:34px}.hero p{margin:0;opacity:.78}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.card,.panel{background:#fff;border:1px solid var(--ln);border-radius:18px;box-shadow:0 8px 28px #1a223a0b}.card{padding:18px}.card small{color:var(--mu)}.card b{display:block;font-size:28px;margin-top:5px}.panel{padding:16px;margin-bottom:14px}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select,button{font:inherit}input,select{border:1px solid var(--ln);border-radius:11px;padding:10px 12px;background:#fff}.q{flex:1;min-width:240px}.btn,.file{border:0;border-radius:11px;padding:10px 13px;cursor:pointer;font-weight:700}.btn{background:var(--b);color:#fff}.btn2,.file{background:#fff;color:var(--tx);border:1px solid var(--ln)}.file input{display:none}.table{overflow:auto;max-height:62vh}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:12px;border-bottom:1px solid #eef0f4;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#fafbfe;color:#778;font-size:12px}.title{font-weight:800;line-height:1.45}.meta{font-size:11px;color:var(--mu);margin-top:5px}.tag{font-size:11px;padding:4px 8px;border-radius:999px;font-weight:800}.high{background:#eaf8f2;color:#0a7a55}.mid{background:#fff5e8;color:#b66308}.low{background:#eef1f5;color:#667085}.empty{text-align:center;color:var(--mu);padding:52px}.modal{position:fixed;inset:0;background:#11182766;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.dialog{background:#fff;width:min(760px,96vw);max-height:90vh;overflow:auto;border-radius:20px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.grid input,.grid select,textarea{width:100%;border:1px solid var(--ln);border-radius:10px;padding:10px}textarea{min-height:90px}.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.foot{text-align:center;color:#98a1b2;font-size:11px;padding:14px}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.hero h1{font-size:28px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></head><body><div class="wrap"><div class="top"><div class="brand">论文<span>雷达</span> · Research Radar</div><div class="pill">● 本地库运行中 · 0 AI token</div></div><section class="hero"><small>PERSONAL RESEARCH INTELLIGENCE</small><h1>把论文检索、整理和跟踪放到一个地方</h1><p>支持本地论文库、Word/CSV/JSON 导入、筛选、去重和备份；后续可接 PubMed / OpenAlex 自动更新。</p></section><div class="stats"><div class="card"><small>论文总数</small><b id="sTotal">0</b></div><div class="card"><small>高相关</small><b id="sHigh">0</b></div><div class="card"><small>待读</small><b id="sTodo">0</b></div><div class="card"><small>精读</small><b id="sRead">0</b></div></div><section class="panel"><div class="tools"><input id="q" class="q" placeholder="搜索题目、作者、关键词、DOI…"><select id="cat"><option value="">全部分类</option></select><select id="rel"><option value="">全部相关度</option><option>高</option><option>中</option><option>低</option></select><select id="st"><option value="">全部状态</option><option>待读</option><option>粗读</option><option>精读</option></select><button class="btn" id="add">+ 添加论文</button><label class="file">导入 Word<input id="docx" type="file" accept=".docx"></label><label class="file">导入 CSV<input id="csv" type="file" accept=".csv"></label><button class="btn2" id="backup">导出 JSON</button></div></section><section class="panel table"><table><thead><tr><th>论文</th><th>年份</th><th>分类</th><th>相关度</th><th>状态</th><th>期刊</th><th>操作</th></tr></thead><tbody id="tb"></tbody></table><div class="empty" id="empty">暂无论文。可以添加、导入 Word 或 CSV。</div></section><div class="foot">数据默认保存在当前浏览器 · GitHub/Vercel 仅托管网页代码</div></div><div class="modal" id="modal"><div class="dialog"><h2 id="mt">添加论文</h2><div class="grid"><input id="fTitle" class="full" placeholder="论文题目"><input id="fAuthors" placeholder="作者"><input id="fYear" placeholder="年份"><input id="fJournal" placeholder="期刊"><input id="fDoi" placeholder="DOI / PMID"><input id="fUrl" class="full" placeholder="原文链接"><input id="fCat" placeholder="分类"><select id="fRel"><option>高</option><option selected>中</option><option>低</option></select><select id="fSt"><option selected>待读</option><option>粗读</option><option>精读</option></select><input id="fKeys" class="full" placeholder="关键词"><textarea id="fNotes" class="full" placeholder="备注 / 摘要 / 可借鉴方法"></textarea></div><div class="acts"><button class="btn2" id="cancel">取消</button><button class="btn" id="save">保存</button></div></div></div><script>const $=id=>document.getElementById(id),KEY='paper-radar-v3';let ps=[],edit=null;const fields=['title','authors','year','journal','doi','url','category','relevance','status','keywords','notes'];function uid(){return crypto.randomUUID?crypto.randomUUID():'p'+Date.now()+Math.random()}function load(){try{ps=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{ps=[]}render()}function persist(){localStorage.setItem(KEY,JSON.stringify(ps));render()}function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}function ident(p){return (p.doi||'').trim().toLowerCase()|| (p.title||'').trim().toLowerCase()}function norm(p){return {id:p.id||uid(),title:(p.title||'').trim(),authors:(p.authors||'').trim(),year:(p.year||'').trim(),journal:(p.journal||'').trim(),doi:(p.doi||'').trim(),url:(p.url||'').trim(),category:(p.category||'').trim(),relevance:['高','中','低'].includes(p.relevance)?p.relevance:'中',status:['待读','粗读','精读'].includes(p.status)?p.status:'待读',keywords:(p.keywords||'').trim(),notes:(p.notes||'').trim()}}function merge(arr){let seen=new Set(ps.map(ident));for(const r of arr){let p=norm(r),k=ident(p);if(!p.title||seen.has(k))continue;ps.unshift(p);seen.add(k)}persist()}function render(){let q=$('q').value.toLowerCase(),c=$('cat').value,r=$('rel').value,s=$('st').value;let cats=[...new Set(ps.map(x=>x.category).filter(Boolean))].sort(),old=c;$('cat').innerHTML='<option value="">全部分类</option>'+cats.map(x=>'<option>'+esc(x)+'</option>').join('');$('cat').value=cats.includes(old)?old:'';let rows=ps.filter(p=>(!q||JSON.stringify(p).toLowerCase().includes(q))&&(!c||p.category===c)&&(!r||p.relevance===r)&&(!s||p.status===s));$('tb').innerHTML=rows.map(p=>`<tr><td><div class="title">${esc(p.title)}</div><div class="meta">${esc(p.authors||'作者未录入')}${p.doi?' · '+esc(p.doi):''}</div></td><td>${esc(p.year||'—')}</td><td>${esc(p.category||'未分类')}</td><td><span class="tag ${p.relevance==='高'?'high':p.relevance==='中'?'mid':'low'}">${p.relevance}</span></td><td>${p.status}</td><td>${esc(p.journal||'—')}</td><td>${p.url?`<a href="${esc(p.url)}" target="_blank">打开</a> · `:''}<a href="#" onclick="ed('${p.id}');return false">编辑</a> · <a href="#" onclick="delp('${p.id}');return false">删除</a></td></tr>`).join('');$('empty').style.display=rows.length?'none':'block';$('sTotal').textContent=ps.length;$('sHigh').textContent=ps.filter(x=>x.relevance==='高').length;$('sTodo').textContent=ps.filter(x=>x.status==='待读').length;$('sRead').textContent=ps.filter(x=>x.status==='精读').length}['q','cat','rel','st'].forEach(x=>$(x).addEventListener(x==='q'?'input':'change',render));function open(p){edit=p?.id||null;$('mt').textContent=p?'编辑论文':'添加论文';['Title','Authors','Year','Journal','Doi','Url','Cat','Rel','St','Keys','Notes'].forEach((k,i)=>$("f"+k).value=p?.[fields[i]]||(['Rel','St'].includes(k)?(k==='Rel'?'中':'待读'):'') );$('modal').classList.add('open')}function close(){$('modal').classList.remove('open')}$('add').onclick=()=>open();$('cancel').onclick=close;$('save').onclick=()=>{let v={id:edit||uid()};['Title','Authors','Year','Journal','Doi','Url','Cat','Rel','St','Keys','Notes'].forEach((k,i)=>v[fields[i]]=$("f"+k).value);v=norm(v);if(!v.title)return alert('请填写题目');let i=ps.findIndex(x=>x.id===v.id);i>=0?ps[i]=v:ps.unshift(v);persist();close()};window.ed=id=>open(ps.find(x=>x.id===id));window.delp=id=>{if(confirm('删除这篇论文？')){ps=ps.filter(x=>x.id!==id);persist()}};function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}$('backup').onclick=()=>download('papers-backup.json',JSON.stringify(ps,null,2),'application/json');function csvParse(t){let a=[],row=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(q){if(c==='"'&&n==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else if(c==='"')q=true;else if(c===','){row.push(v);v=''}else if(c==='\n'){row.push(v);a.push(row);row=[];v=''}else if(c!=='\r')v+=c}row.push(v);if(row.some(Boolean))a.push(row);return a}const alias={title:['title','题目','标题','论文题目'],authors:['authors','author','作者'],year:['year','年份'],journal:['journal','期刊','来源'],doi:['doi','pmid','doi/pmid'],url:['url','link','链接'],category:['category','分类','方向'],relevance:['relevance','相关度'],status:['status','状态','阅读状态'],keywords:['keywords','关键词'],notes:['notes','备注','摘要']};function key(s){s=String(s).trim().toLowerCase().replace(/[\s_\-：:（）()]/g,'');for(const [k,a] of Object.entries(alias))if(a.some(x=>x.toLowerCase().replace(/[\s_\-：:（）()]/g,'')===s))return k;return null}$('csv').onchange=async e=>{let f=e.target.files[0];if(!f)return;let rows=csvParse(await f.text()),h=rows[0].map(key);merge(rows.slice(1).map(r=>{let p={};h.forEach((k,i)=>{if(k)p[k]=r[i]||''});return p}));e.target.value=''};function txt(n){return Array.from(n.getElementsByTagNameNS('*','t')).map(x=>x.textContent||'').join('').trim()}$('docx').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(!/\.docx$/i.test(f.name))return alert('请使用 .docx 文件');try{let z=await JSZip.loadAsync(f),x=await z.file('word/document.xml').async('string'),d=new DOMParser().parseFromString(x,'application/xml'),out=[];for(const t of d.getElementsByTagNameNS('*','tbl')){let rs=Array.from(t.getElementsByTagNameNS('*','tr')).map(tr=>Array.from(tr.getElementsByTagNameNS('*','tc')).map(txt));if(rs.length<2)continue;let h=rs[0].map(key);if(!h.includes('title'))continue;out.push(...rs.slice(1).map(r=>{let p={};h.forEach((k,i)=>{if(k)p[k]=r[i]||''});return p}))}if(!out.length){let cur={};for(const line of Array.from(d.getElementsByTagNameNS('*','p')).map(txt)){let m=line.match(/^\s*([^:：]{1,20})[:：]\s*(.+)$/);if(!m)continue;let k=key(m[1]);if(!k)continue;if(k==='title'&&cur.title){out.push(cur);cur={}}cur[k]=m[2]}if(cur.title)out.push(cur)}if(!out.length)return alert('没有识别到论文记录。建议 Word 第一行使用：题目、作者、年份、期刊、DOI、链接、分类、相关度、状态、关键词、备注。');merge(out)}catch(err){alert('Word 解析失败，请确认是有效 .docx 文件')}e.target.value=''};load()</script></body></html>
